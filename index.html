<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Веб-чат MAX на GREEN-API" />
    <title>Чат MAX — GREEN-API</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('gamc.theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (ignored) {
          /* localStorage может быть недоступен — тогда просто светлая тема */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
